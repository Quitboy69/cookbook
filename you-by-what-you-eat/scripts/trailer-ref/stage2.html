<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>

.lay{position:absolute;inset:0;will-change:transform}

.chip{display:inline-block;font:700 7.5px/1 "Inter",sans-serif;padding:3px 6px;border-radius:99px;margin:0 3px 0 0}

#a3{background:#000}

#cta{position:absolute;left:50%;top:600px;transform-origin:50% 50%;padding:14px 0;margin-left:-125px;width:250px;text-align:center;white-space:nowrap;border-radius:999px;background:linear-gradient(135deg,#12B886,#0B8F68);color:#fff;font:800 12.5px/1 "Inter",system-ui;letter-spacing:.1em;text-transform:uppercase}
#note{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:500 10.5px/1.4 "Inter",system-ui;color:#64748B}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style></head><body>
<div id="root">

  <div id="cap">POV: Du erstellst die Werbung<br>für deine eigene App</div>

    <div class="act" id="a1"><div class="glow"></div><div class="arch"></div><div id="a1t"><div class="r l1"></div><div class="r"><div class="pill"></div></div><div class="r l3"></div></div></div>

  <div id="fade"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const clamp01 = x => Math.max(0, Math.min(1, x));
const mixn = (a, b, k) => a + (b - a) * k;
const E = { outCubic: x => 1 - Math.pow(1 - clamp01(x), 3), inCubic: x => Math.pow(clamp01(x), 3), inOut: x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; } };
const sp = (x, d, f) => x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(f * x);
const rnd = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const GL = 'ABCDEFGHJKLMNOPRSTUVWXYZ#%&*+';
const ACTS = [{ id: 'a1', t0: 0, t1: 5, g: [123, 47, 247] }, { id: 'a2', t0: 5, t1: 9.5, g: [185, 168, 255] }, { id: 'a3', t0: 9.5, t1: 14.5, g: [59, 63, 224] }, { id: 'a4', t0: 14.5, t1: 17.5, g: [227, 184, 245] }];
const END_T = 17.5;
const WORDS = [
  { l1: 'DEINE', l2: 'ÜBUNGEN', icon: '🤸', t0: 9.5, t1: 11.5, ix: 352, iy: 72 },
  { l1: 'DEINE', l2: 'LÄUFE', icon: '🏃', t0: 11.5, t1: 13.0, ix: 352, iy: 72 },
  { l1: 'NEUE', l2: 'FREUNDE', icon: '👥', t0: 13.0, t1: 14.5, ix: 330, iy: 72 }
];
const CARDS = [
  { x: 24, y: 34, side: -1, h: '<div class="ic" style="background:#DCFCE7">💪</div><div><b>Workout geschafft</b><small>Ganzkörper · +54 Pkt</small></div>' },
  { x: 20, y: 100, side: -1, h: '<div class="ic" style="background:#E0E7FF">💬</div><div><b>Max</b><small>Wer kommt zum Beine-Tag? 🦵</small></div>' },
  { x: 40, y: 170, side: -1, cls: 'stk', h: '<div><div class="big">🦵</div><div class="lbl">LEG DAY</div></div>' },
  { x: 318, y: 30, side: 1, h: '<div class="ic" style="background:#FEF3C7">🏆</div><div><b>Platz 1 · Sara</b><small>84 Punkte diese Woche</small></div>' },
  { x: 322, y: 98, side: 1, h: '<div class="ic" style="background:#FFEDD5">🏃</div><div><b>Lauf 7,4 km</b><small>41 Min · von Strava</small></div>' },
  { x: 304, y: 166, side: 1, h: '<div><b>Muskel-Grafik</b><div style="margin-top:4px"><span class="chip" style="background:#FEE2E2;color:#B91C1C">Brust</span><span class="chip" style="background:#FFEDD5;color:#C2410C">Bauch</span><span class="chip" style="background:#FFEDD5;color:#C2410C">Schultern</span></div></div>' },
  { x: 158, y: 8, side: -1, w: 100, h: '<div class="ic" style="background:#FFE4E6">🔥</div><div><b>7 Tage Serie</b></div>' },
  { x: 300, y: 228, side: 1, w: 104, h: '<div class="ic" style="background:#EDE9FE">⚡</div><div><b>137 Übungen</b></div>' }
];
const BARS = ['#3D8BFD', '#9B5DE5', '#F15BB5', '#00C2A8', '#F5C518', '#FF6B6B'];
let S = null;

window.setup = cfg => {
  S = cfg; S.layers = [mkLayer($('#lay0')), mkLayer($('#lay1'))];
  S.mix = (a, b, k) => a.map((v, i) => Math.round(mixn(v, b[i], k)));
  $('#logo').src = $('#a4logo').src = 'data:image/png;base64,' + cfg.icon;
  // Raum / Laptop-Zeitleiste
  const tl = $('#tl'); S.rows = [];
  for (let r = 0; r < 14; r++) {
    const row = document.createElement('div'); row.className = 'row'; row.style.top = (16 + r * 8.6) + 'px';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.style.top = (17.5 + r * 8.6) + 'px'; nm.style.width = (14 + rnd(r + 3) * 14) + 'px'; tl.append(nm);
    for (let b = 0; b < 3; b++) { const i = document.createElement('i'); const l = 8 + rnd(r * 7 + b) * 52, s = (b * 33 + rnd(r * 3 + b * 5) * 20); i.style.cssText = `left:${s}%;width:${l}%;background:${BARS[(r + b * 2) % 6]};opacity:${.55 + rnd(r + b) * .4}`; if (s + l > 100) i.style.width = (100 - s) + '%'; row.append(i); }
    tl.append(row);
  }
  const ph2 = document.createElement('div'); ph2.id = 'ph2'; tl.append(ph2); S.ph2 = ph2;
  const base = $('#base'); for (let r = 0; r < 5; r++) for (let c = 0; c < 15; c++) { const k = document.createElement('i'); k.style.cssText = `left:${10 + c * 20.4}px;top:${10 + r * 11.5}px;width:${r === 4 && c > 3 && c < 11 ? 0 : 17}px`; if (r === 4 && c === 4) k.style.cssText = 'left:92px;top:' + (10 + 4 * 11.5) + 'px;width:140px;height:8px'; base.append(k); }
  // Akt 1 Buchstaben
  const mk = (el, txt) => { el.innerHTML = [...txt].map(c => `<span data-c="${c}">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); return [...el.querySelectorAll('span')]; };
  S.l1 = mk($('#a1t .l1'), 'EINE APP FÜR'); S.pl = mk($('#a1t .pill'), 'UNSCHLAGBARES'); S.l3 = mk($('#a1t .l3'), 'TRAINING');
  S.spk = [[150, 150, 1], [330, 138, 1.3], [322, 182, .8], [158, 186, 1.1], [240, 92, .9]].map(([x, y, z], i) => { const e = document.createElement('i'); e.className = 'spk'; e.textContent = '✦'; e.style.left = x + 'px'; e.style.top = y + 'px'; $('#a1').append(e); return { e, z, i }; });
  // Akt 2 Karten
  S.cards = CARDS.map((c, i) => { const e = document.createElement('div'); e.className = 'card' + (c.cls ? ' ' + c.cls : ''); e.style.left = c.x + 'px'; e.style.top = c.y + 'px'; if (c.w) e.style.width = c.w + 'px'; e.innerHTML = c.h; $('#a2').insertBefore(e, i < 6 ? $('#ph') : null); return { e, c, i }; });
  // Akt 3 Wörter
  S.words = WORDS.map(w => { const d = document.createElement('div'); d.className = 'w'; const a = document.createElement('div'); a.className = 'ln l1'; const b = document.createElement('div'); b.className = 'ln l2'; d.append(a, b); $('#a3').insertBefore(d, $('#ico')); return { w, el: d, l1: mk(a, w.l1), l2: mk(b, w.l2) }; });
  S.ico = $('#ico');
  S.t1 = $('#a4 .t1'); S.t2 = $('#a4 .t2'); S.a4a = mk(S.t1, 'ALLES IN'); S.a4b = mk(S.t2, 'EINER APP'); S.brand = mk($('#a4 .brand'), 'You By What You Eat');
  // Abspann
  $('#ttl').innerHTML = ['YOU BY', 'WHAT YOU EAT'].map((line, li) => '<div>' + [...line].map((c, i) => c === ' ' ? '<span class="l" style="width:.45em"></span>' : `<span class="l${li ? ' a' : ''}" data-i="${(li ? 6 : 0) + i}">${c}</span>`).join('') + '</div>').join('');
  $('#bul').innerHTML = cfg.bullets.map(b => `<div>${b}</div>`).join('');
  S.ttlL = [...document.querySelectorAll('#ttl .l')]; S.bulD = [...document.querySelectorAll('#bul div')];
  S.stars = []; const st = $('#end');
  for (let i = 0; i < 46; i++) { const d = document.createElement('i'); d.className = 'star'; const r = 1 + (i * 37 % 3) * .6; d.style.cssText = `width:${r}px;height:${r}px`; st.prepend(d); S.stars.push({ el: d, x: (i * 73 % 100) * 3.6, y0: (i * 131 % 100) * 7.8, sp: 8 + (i * 17 % 10) * 2.2, ph: i * 1.3 }); }
};
function mkLayer(el) { const a = new Image(), b = new Image(); a.decoding = b.decoding = 'async'; el.append(a, b); return { el, a, b, sa: '', sb: '' }; }
function frameIdx(t) { const ts = S.ts; let lo = 0, hi = ts.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ts[m] <= t) lo = m; else hi = m - 1; } return lo; }
async function fill(layer, tau, jobs) {
  const k = frameIdx(tau), ts = S.ts, ua = S.urls[k];
  if (layer.sa !== ua) { layer.sa = ua; layer.a.src = ua; jobs.push(layer.a.decode().catch(() => {})); }
  let w = 0; if (k + 1 < ts.length && ts[k + 1] - ts[k] <= 0.024) w = (tau - ts[k]) / (ts[k + 1] - ts[k]);
  if (w > 0.02) { const ub = S.urls[k + 1]; if (layer.sb !== ub) { layer.sb = ub; layer.b.src = ub; jobs.push(layer.b.decode().catch(() => {})); } layer.b.style.opacity = Math.min(1, w); layer.b.style.display = ''; } else layer.b.style.display = 'none';
}
function setText(spans, fn) { spans.forEach((s, i) => { const r = fn(i, s.dataset.c); if (r.t !== s._t) { s._t = r.t; s.textContent = r.t; } s.style.opacity = r.o; if (r.tf !== undefined) s.style.transform = r.tf; }); }
function glitch(t, base, step) { return (i, c) => { const x = t - (base + i * step); if (c === ' ') return { t: ' ', o: x > 0 ? 1 : 0 }; if (x < 0) return { t: c, o: 0 }; if (x < .3) return { t: GL[(Math.floor(t * 30) * 5 + i * 7) % GL.length], o: 1, tf: `translateX(${(rnd(Math.floor(t * 30) + i) - .5) * 3}px)` }; return { t: c, o: 1, tf: 'none' }; }; }

window.render = async t => {
  const ai = t >= END_T ? 3 : ACTS.findIndex(a => t >= a.t0 && t < a.t1), act = ACTS[Math.max(0, ai)], inEnd = t >= END_T, te = t - END_T;
  // ---- Raum + Leuchten des Monitors
  const prev = ACTS[Math.max(0, ai - 1)], k = E.inOut((t - act.t0) / .35);
  let g = ai === 0 ? act.g : S.mix(prev.g, act.g, k); const on = clamp01((t - .3) / .35); g = g.map(v => Math.round(v * on));
  const gl = `${g[0]},${g[1]},${g[2]}`;
  $('#room').style.background = `radial-gradient(90% 40% at 50% 34%, rgba(${gl},${(.30 * on).toFixed(3)}), transparent 70%), #05040a`;
  $('#mon').style.boxShadow = `0 0 0 1px #1d1b24, 0 0 46px 14px rgba(${gl},${(.5 * on).toFixed(3)}), 0 0 140px 50px rgba(${gl},${(.22 * on).toFixed(3)})`;
  $('#lap').style.boxShadow = `0 0 0 1px #24232b, 0 -6px 40px rgba(${gl},${(.12 * on).toFixed(3)})`;
  // Laptop-Zeitleiste
  const prog = clamp01(t / END_T); S.ph2.style.left = (34 + prog * 238) + 'px';
  const secs = Math.floor(t), fr = Math.floor((t - secs) * 30); $('#tc').textContent = `00:00:${String(secs).padStart(2, '0')}:${String(fr).padStart(2, '0')}`.slice(3);
  // ---- Akte ein-/ausblenden (kurze Überblendung wie im Vorbild)
  ACTS.forEach((a, i) => { const el = $('#' + a.id); const vis = t >= a.t0 - 1e-6 && t < a.t1 + .22 && !(i === 3 && inEnd); el.style.display = vis ? 'block' : 'none'; el.style.opacity = i === 0 ? 1 : clamp01((t - a.t0) / .18); el.style.zIndex = i; });
  if (t < .35) { $('#scr').style.background = '#17171a'; ACTS.forEach(a => { $('#' + a.id).style.display = 'none'; }); }

  // ---- Akt 1
  if (t < 5.3) {
    const aP = Math.min(1.08, sp((t - .35) * 1.15, 9, 12)); const arch = $('#a1 .arch');
