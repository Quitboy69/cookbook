<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F3F5F7">
  <meta name="color-scheme" content="light dark">
  <title>You By What You Eat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="screens" aria-live="polite"></main>

  <nav id="nav" aria-label="Bereiche">
    <span id="nav-pill" aria-hidden="true"></span>
    <button class="nav-btn" data-go="#/heute" data-tab="heute"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg><span>Heute</span></button>
    <button class="nav-btn" data-go="#/plan" data-tab="essen"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5a2 2 0 0 0 2 2M9 3v5a2 2 0 0 1-2 2"/><path d="M17 21V3c-2 1-3.5 3.5-3.5 7 0 2 1 3 3.5 3"/></svg><span>Essen</span></button>
    <button class="nav-btn nav-plus" data-act="foodcam" aria-label="Essen fotografieren"><span class="scan-orb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.5-2h5.6l1.5 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
    <button class="nav-btn" data-go="#/training" data-tab="training"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14.5" cy="4.3" r="1.9"/><path d="M8.2 9.6l3.6-1.4 3 2.2 2.6 3"/><path d="M11.8 8.2l-1.9 5.3 3.4 2.7-1.1 5"/><path d="M9.9 13.5l-1.8 3.3-4 .7"/></svg><span>Training</span></button>
    <button class="nav-btn" data-go="#/freunde" data-tab="freunde"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.3 2.8-5.2 5.5-5.2s4.9 1.9 5.5 5.2"/><circle cx="16.8" cy="9" r="2.5"/><path d="M15.6 14.2c2.6-.2 4.4 1.5 4.9 4.6"/></svg><span>Freunde</span><i class="nav-badge" id="nav-badge" hidden></i></button>
  </nav>

  <div id="toasts" aria-live="assertive"></div>
  <script src="app.js"></script>
</body>
</html>
